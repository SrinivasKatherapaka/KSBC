<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%" fill="none">
  <!-- Brand Color Palette Defs -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;display=swap');
      .ksbc-logo-text { font-family: 'Archivo Black', 'Impact', sans-serif; }
    </style>
  </defs>

  <!-- Left: Classical Bank Temple with Laurel & 3 Stars Insignia -->
  <g transform="translate(20, 10)">
    <!-- 3 Stars at top -->
    <!-- Center Star -->
    <path d="M 85 10 L 87.5 16.5 L 94.5 16.5 L 89 20.5 L 91 27 L 85 23 L 79 27 L 81 20.5 L 75.5 16.5 L 82.5 16.5 Z" fill="#1E2748" />
    <!-- Left Star -->
    <path d="M 68 15 L 70 20.5 L 76 20.5 L 71.5 24 L 73 29.5 L 68 26 L 63 29.5 L 64.5 24 L 60 20.5 L 66 20.5 Z" fill="#1E2748" />
    <!-- Right Star -->
    <path d="M 102 15 L 104 20.5 L 110 20.5 L 105.5 24 L 107 29.5 L 102 26 L 97 29.5 L 98.5 24 L 94 20.5 L 100 20.5 Z" fill="#1E2748" />

    <!-- Circular Laurel Wreath Left -->
    <g fill="#1E2748">
      <ellipse cx="28" cy="45" rx="4" ry="7.5" transform="rotate(-55 28 45)" />
      <ellipse cx="20" cy="62" rx="4.5" ry="8" transform="rotate(-40 20 62)" />
      <ellipse cx="16" cy="82" rx="4.5" ry="8.5" transform="rotate(-20 16 82)" />
      <ellipse cx="17" cy="103" rx="4.5" ry="8.5" transform="rotate(0 17 103)" />
      <ellipse cx="23" cy="123" rx="4.5" ry="8" transform="rotate(25 23 123)" />
      <ellipse cx="35" cy="140" rx="4" ry="7.5" transform="rotate(50 35 140)" />
      <ellipse cx="52" cy="152" rx="4" ry="7" transform="rotate(70 52 152)" />
      <!-- Inner wreath leaves -->
      <ellipse cx="33" cy="58" rx="3.5" ry="6.5" transform="rotate(-45 33 58)" />
      <ellipse cx="28" cy="78" rx="3.5" ry="7" transform="rotate(-20 28 78)" />
      <ellipse cx="29" cy="98" rx="3.5" ry="7" transform="rotate(5 29 98)" />
      <ellipse cx="36" cy="118" rx="3.5" ry="6.5" transform="rotate(30 36 118)" />
      <ellipse cx="48" cy="134" rx="3.5" ry="6" transform="rotate(55 48 134)" />
    </g>

    <!-- Circular Laurel Wreath Right -->
    <g fill="#1E2748">
      <ellipse cx="142" cy="45" rx="4" ry="7.5" transform="rotate(55 142 45)" />
      <ellipse cx="150" cy="62" rx="4.5" ry="8" transform="rotate(40 150 62)" />
      <ellipse cx="154" cy="82" rx="4.5" ry="8.5" transform="rotate(20 154 82)" />
      <ellipse cx="153" cy="103" rx="4.5" ry="8.5" transform="rotate(0 153 103)" />
      <ellipse cx="147" cy="123" rx="4.5" ry="8" transform="rotate(-25 147 123)" />
      <ellipse cx="135" cy="140" rx="4" ry="7.5" transform="rotate(-50 135 140)" />
      <ellipse cx="118" cy="152" rx="4" ry="7" transform="rotate(-70 118 152)" />
      <!-- Inner wreath leaves -->
      <ellipse cx="137" cy="58" rx="3.5" ry="6.5" transform="rotate(45 137 58)" />
      <ellipse cx="142" cy="78" rx="3.5" ry="7" transform="rotate(20 142 78)" />
      <ellipse cx="141" cy="98" rx="3.5" ry="7" transform="rotate(-5 141 98)" />
      <ellipse cx="134" cy="118" rx="3.5" ry="6.5" transform="rotate(-30 134 118)" />
      <ellipse cx="122" cy="134" rx="3.5" ry="6" transform="rotate(-55 122 134)" />
    </g>

    <!-- Classical Greek/Roman Banking Temple Architecture -->
    <!-- Pediment Roof Triangular Structure with Perspective -->
    <polygon points="85,38 46,62 124,62" fill="#1E2748" />
    <polygon points="85,44 54,60 116,60" fill="#FAF7E6" />
    <rect x="42" y="62" width="86" height="5" rx="1" fill="#1E2748" />

    <!-- 6 Columns -->
    <rect x="47" y="69" width="7" height="36" rx="1" fill="#1E2748" />
    <rect x="59" y="69" width="7" height="36" rx="1" fill="#1E2748" />
    <rect x="71" y="69" width="7" height="36" rx="1" fill="#1E2748" />
    <rect x="83" y="69" width="7" height="36" rx="1" fill="#1E2748" />
    <rect x="95" y="69" width="7" height="36" rx="1" fill="#1E2748" />
    <rect x="107" y="69" width="7" height="36" rx="1" fill="#1E2748" />

    <!-- Capital / Base Details -->
    <rect x="45" y="67" width="11" height="3" rx="0.5" fill="#1E2748" />
    <rect x="57" y="67" width="11" height="3" rx="0.5" fill="#1E2748" />
    <rect x="69" y="67" width="11" height="3" rx="0.5" fill="#1E2748" />
    <rect x="81" y="67" width="11" height="3" rx="0.5" fill="#1E2748" />
    <rect x="93" y="67" width="11" height="3" rx="0.5" fill="#1E2748" />
    <rect x="105" y="67" width="11" height="3" rx="0.5" fill="#1E2748" />

    <rect x="45" y="104" width="11" height="3" rx="0.5" fill="#1E2748" />
    <rect x="57" y="104" width="11" height="3" rx="0.5" fill="#1E2748" />
    <rect x="69" y="104" width="11" height="3" rx="0.5" fill="#1E2748" />
    <rect x="81" y="104" width="11" height="3" rx="0.5" fill="#1E2748" />
    <rect x="93" y="104" width="11" height="3" rx="0.5" fill="#1E2748" />
    <rect x="105" y="104" width="11" height="3" rx="0.5" fill="#1E2748" />

    <!-- Multi-tiered Base Steps (Stylobate) -->
    <rect x="40" y="107" width="90" height="4" rx="1" fill="#1E2748" />
    <rect x="36" y="112" width="98" height="4.5" rx="1" fill="#1E2748" />
    <rect x="32" y="117.5" width="106" height="5" rx="1" fill="#1E2748" />
  </g>

  <!-- Right: Archivo Black KSBC Typography & SINCE 2026 -->
  <g transform="translate(205, 30)">
    <!-- KSBC Main Header Text in Archivo Black -->
    <text x="0" y="86" fill="#1E2748" class="ksbc-logo-text" font-family="'Archivo Black', 'Impact', sans-serif" font-weight="900" font-size="92" letter-spacing="3">KSBC</text>
    <!-- SINCE 2026 Subtitle Text with authoritative wide tracking -->
    <text x="4" y="132" fill="#1E2748" class="ksbc-logo-text" font-family="'Archivo Black', 'Inter', sans-serif" font-weight="900" font-size="24" letter-spacing="12" opacity="0.95">SINCE 2026</text>
  </g>
</svg>
