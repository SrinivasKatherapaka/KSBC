<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="100%" height="100%" fill="none">
  <!-- Brand Color Palette Defs -->
  <defs>
    <linearGradient id="ksbcGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eed29e" />
      <stop offset="50%" stop-color="#dfbd84" />
      <stop offset="100%" stop-color="#c59e5f" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#dfbd84" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left: Classical Bank Temple with Laurel & Decorative Base -->
  <g transform="translate(10, 15)" filter="url(#goldGlow)">
    <!-- Pediment Roof Triangular Structure -->
    <path d="M 90 22 L 20 62 L 160 62 Z" fill="none" stroke="#dfbd84" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M 90 32 L 36 62 L 144 62 Z" fill="#dfbd84" fill-opacity="0.15" />
    <!-- Pediment horizontal architrave beam -->
    <rect x="14" y="62" width="152" height="7" rx="1.5" fill="#dfbd84" />
    
    <!-- 6 Classical Fluted Columns -->
    <!-- Column 1 -->
    <rect x="25" y="73" width="12" height="42" rx="1.5" fill="#dfbd84" />
    <rect x="23" y="69" width="16" height="4" rx="1" fill="#dfbd84" />
    <rect x="23" y="115" width="16" height="4" rx="1" fill="#dfbd84" />

    <!-- Column 2 -->
    <rect x="47" y="73" width="12" height="42" rx="1.5" fill="#dfbd84" />
    <rect x="45" y="69" width="16" height="4" rx="1" fill="#dfbd84" />
    <rect x="45" y="115" width="16" height="4" rx="1" fill="#dfbd84" />

    <!-- Column 3 -->
    <rect x="69" y="73" width="12" height="42" rx="1.5" fill="#dfbd84" />
    <rect x="67" y="69" width="16" height="4" rx="1" fill="#dfbd84" />
    <rect x="67" y="115" width="16" height="4" rx="1" fill="#dfbd84" />

    <!-- Column 4 -->
    <rect x="99" y="73" width="12" height="42" rx="1.5" fill="#dfbd84" />
    <rect x="97" y="69" width="16" height="4" rx="1" fill="#dfbd84" />
    <rect x="97" y="115" width="16" height="4" rx="1" fill="#dfbd84" />

    <!-- Column 5 -->
    <rect x="121" y="73" width="12" height="42" rx="1.5" fill="#dfbd84" />
    <rect x="119" y="69" width="16" height="4" rx="1" fill="#dfbd84" />
    <rect x="119" y="115" width="16" height="4" rx="1" fill="#dfbd84" />

    <!-- Column 6 -->
    <rect x="143" y="73" width="12" height="42" rx="1.5" fill="#dfbd84" />
    <rect x="141" y="69" width="16" height="4" rx="1" fill="#dfbd84" />
    <rect x="141" y="115" width="16" height="4" rx="1" fill="#dfbd84" />

    <!-- Multi-tiered Base Steps (Crepidoma / Stylobate) -->
    <rect x="12" y="119" width="156" height="6" rx="1.5" fill="#dfbd84" />
    <rect x="5" y="127" width="170" height="6.5" rx="1.5" fill="#dfbd84" />
    <rect x="0" y="135.5" width="180" height="5" rx="1.5" fill="#dfbd84" />

    <!-- Left Laurel / Wheat Ear Stalk -->
    <g transform="translate(-10, 70)" fill="#dfbd84">
      <ellipse cx="6" cy="6" rx="4.5" ry="8" transform="rotate(-35 6 6)" />
      <ellipse cx="14" cy="18" rx="4.5" ry="8" transform="rotate(-15 14 18)" />
      <ellipse cx="2" cy="22" rx="4.5" ry="8" transform="rotate(-45 2 22)" />
      <ellipse cx="12" cy="34" rx="4.5" ry="8" transform="rotate(-20 12 34)" />
      <ellipse cx="0" cy="38" rx="4.5" ry="8" transform="rotate(-50 0 38)" />
      <ellipse cx="10" cy="50" rx="4" ry="7" transform="rotate(-25 10 50)" />
      <ellipse cx="0" cy="54" rx="4" ry="7" transform="rotate(-55 0 54)" />
    </g>

    <!-- Right Laurel / Wheat Ear Stalk -->
    <g transform="translate(170, 70)" fill="#dfbd84">
      <ellipse cx="14" cy="6" rx="4.5" ry="8" transform="rotate(35 14 6)" />
      <ellipse cx="6" cy="18" rx="4.5" ry="8" transform="rotate(15 6 18)" />
      <ellipse cx="18" cy="22" rx="4.5" ry="8" transform="rotate(45 18 22)" />
      <ellipse cx="8" cy="34" rx="4.5" ry="8" transform="rotate(20 8 34)" />
      <ellipse cx="20" cy="38" rx="4.5" ry="8" transform="rotate(50 20 38)" />
      <ellipse cx="10" cy="50" rx="4" ry="7" transform="rotate(25 10 50)" />
      <ellipse cx="20" cy="54" rx="4" ry="7" transform="rotate(55 20 54)" />
    </g>

    <!-- Horizontal Baseline Accents -->
    <line x1="-12" y1="147" x2="6" y2="147" stroke="#dfbd84" stroke-width="4.5" stroke-linecap="round" />
    <line x1="174" y1="147" x2="192" y2="147" stroke="#dfbd84" stroke-width="4.5" stroke-linecap="round" />
    <line x1="20" y1="147" x2="160" y2="147" stroke="#dfbd84" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Right: Bold authoritative KSBC Typography & SINCE 2026 -->
  <g transform="translate(225, 20)">
    <!-- KSBC Main Header Text -->
    <text x="0" y="96" fill="url(#ksbcGoldGrad)" font-family="'Outfit', 'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="96" letter-spacing="4" filter="url(#goldGlow)">KSBC</text>
    <!-- SINCE 2026 Subtitle Text with authoritative wide tracking -->
    <text x="4" y="138" fill="#dfbd84" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="28" letter-spacing="9" opacity="0.95">SINCE 2026</text>
  </g>
</svg>
